name: Rust GUI (rs)

# Rust GUI クライアント（rs/, issue #19）を GitHub Actions でビルドする。
# ローカルに Rust ツールチェーンが無くても CI で検証できる。
# rs/Cargo.toml がまだ無い間は build をスキップして成功させる。

on:
  push:
    branches: [main]
    paths:
      - "rs/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rs/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4

      - name: Check for rs/Cargo.toml
        id: check
        shell: bash
        working-directory: .
        run: |
          if [ -f rs/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        shell: bash
        working-directory: .
        run: echo "::notice::rs/Cargo.toml not found; skipping Rust build."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.exists == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.exists == 'true'
        with:
          workspaces: rs

      - name: cargo fmt --check
        if: steps.check.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.check.outputs.exists == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        if: steps.check.outputs.exists == 'true'
        run: cargo build --release

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cargo test

      - name: Upload exe
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chira-rs-windows
          path: rs/target/release/*.exe
          if-no-files-found: ignore
