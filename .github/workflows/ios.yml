name: iOS Client (gui/iphone)

on:
  push:
    branches: [main]
    paths:
      - "gui/iphone/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "gui/iphone/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project gui/iphone/ChiraUra.xcodeproj \
            -scheme ChiraUra \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Debug App
        run: |
          xcodebuild build \
            -project gui/iphone/ChiraUra.xcodeproj \
            -scheme ChiraUra \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
