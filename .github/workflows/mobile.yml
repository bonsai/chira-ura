name: mobile (apk)

on:
  push:
    paths:
      - 'mob/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        working-directory: mob/mobile
        run: flutter pub get
      - name: Build APK
        working-directory: mob/mobile
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chira-mobile-apk
          path: mob/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error