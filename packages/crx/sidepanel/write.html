<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura — 書く</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 書く -->
    <main class="editor">
      <textarea id="note" placeholder="ここにメモを書く… 自動保存されます"></textarea>
    </main>

    <!-- ステータス（下部・絵文字のみ） -->
    <div class="statusline">
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <!-- フッター: 操作のみ（ブランド・リンクは popup に集約） -->
    <footer class="footer">
      <button class="btn ghost" id="btnNew">＋ NEW</button>
      <button class="btn copy" id="btnCopy">コピー</button>
      <a class="btn ghost" id="btnLog" href="read.html">過去記事</a>
    </footer>
  </div>

  <script type="module" src="write.js"></script>
</body>
</html>
