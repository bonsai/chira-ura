<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura / チラ裏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- コマンド: 3 つのみ -->
    <nav class="cmds">
      <button class="cmd" id="cmdSetting" title="設定する（home.html をサイドパネルに開く）">
        <span class="label">⚙ 箱を設定する</span>
      </button>
      <button class="cmd" id="cmdWrite"><span class="label">📝 書く</span></button>
    </nav>

    <!-- ステータス: 絵文字のみ -->
    <div class="statusline">
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <hr class="rule" />

    <!-- 最下部: フッターボタン + ステータス -->
    <footer class="footer">
      <button class="cmd mini" id="cmdPlus" title="…">＋</button>
      <span class="status muted" id="statusFooter">—</span>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
