<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura / チラ裏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- コマンド -->
    <nav class="cmds">
      <!-- 箱 + 自動同期 -->
      <div class="cmd-row">
        <button class="cmd grow" id="cmdBox">
          <span class="label">箱を設定する</span>
          <span class="hint" id="hintBox">GDrive</span>
        </button>
        <label class="switch" title="自動同期">
          <input type="checkbox" id="toggleSync" checked />
          <span class="knob"></span>
        </label>
      </div>

      <button class="cmd" id="cmdRead"><span class="label">読む</span></button>
      <button class="cmd" id="cmdWrite"><span class="label">書く</span></button>
    </nav>

    <!-- 箱パネル（選択肢: OAuth / CLI） -->
    <div class="panel" id="boxPanel" hidden>
      <button class="box active" data-box="local">ローカル<span class="dot"></span></button>
      <button class="box" data-box="gdrive">GDrive<span class="dot"></span></button>
      <button class="box" data-box="gh">GitHub<span class="dot"></span></button>
      <button class="box" data-box="box">Box<span class="dot"></span></button>

      <div class="panel-row">
        <span class="row-label">フォルダ</span>
        <input id="folderInput" type="text" placeholder="folder ID / name" spellcheck="false" />
      </div>
      <div class="panel-row">
        <span class="row-label">読む</span>
        <input type="file" id="jsonlFile" accept=".jsonl,.json" hidden />
        <label class="link" for="jsonlFile">ファイル</label>
        <input type="file" id="keysFile" accept=".json,application/json" hidden />
        <label class="link" for="keysFile">cli.js</label>
      </div>
    </div>

    <!-- ステータス: 自動保存 + 絵文字のみ -->
    <div class="statusline">
      <label class="switch" title="自動保存">
        <input type="checkbox" id="toggleAuto" checked />
        <span class="knob"></span>
      </label>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <hr class="rule" />

    <!-- 最下部: ver（履歴リンク）+ ロゴ（サイトリンク） -->
    <footer class="footer">
      <a class="ver" id="linkVer" target="_blank" rel="noopener">ver -</a>
      <a class="logo" id="linkLogo" target="_blank" rel="noopener">
        <img src="../icons/icon.svg" alt="chira-ura" />
      </a>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
