# chira-ura UI 仕様（実装の正）
# 変更したら実装（crx/）と同時に更新する。ここに無い UI は足さない。
version: 0.1.0-rel
updated: 2026-10-19

brand:
  name: chira-ura / チラ裏
  mark: "chira<span>ura</span>"
  placement: [popup.footer]             # sidepanel には置かない
  gh: https://github.com/bonsai/chira-ura   # リンクは popup の「イシュー」「履歴」に統合

tokens:                                # crx/popup/style.css, crx/sidepanel/style.css
  washi: "#faf7f0"
  sumi: "#2c241e"
  enji: "#8b0000"                      # accent / active
  ink: "#3a322a"
  border: "#e3dcc9"
  mute: "#8a8071"
  font: '"Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif'
  mono: "ui-monospace, SFMono-Regular, Menlo, monospace"

popup:                                 # crx/popup/{index.html,app.js,style.css}
  width: 300
  height: auto
  header: none
  editor: none                         # 入力欄は置かない（書くのは sidepanel）
  commands:                            # 動詞のみ
    max: 7
    items:
      - { id: cmdWrite,   label: 書く,   action: "sidePanel.open(sidepanel/write.html)" }
      - { id: cmdRead,    label: 読む,   action: "sidePanel.open(sidepanel/read.html)" }
      - { id: cmdBox,     label: 箱,     action: toggle(boxPanel), hint: active box name }
      - { id: cmdIssue,   label: イシュー, action: "open <repo>/issues/new" }
      - { id: cmdHistory, label: 履歴,   action: "open <repo>#readme" }
    removed: [コピー, 積む, 取る, 読み込む]   # 2026-10-19 に削除。読む/箱に統合
  box_panel:                           # 「箱」で開閉。保存先 + フォルダ + ファイル
    items: [local, gdrive, gh, box]
    mark: dot                          # 選択中は enji の点
    default: gdrive
    actions:
      local:  { auth: none }
      gdrive: { auth: "chrome.identity.getAuthToken", scope: "drive.file" }
      gh:     { auth: "launchWebAuthFlow", client_id: "keys.auth.gh.clientId" }
      box:    { auth: "launchWebAuthFlow", client_id: "keys.auth.box.clientId" }
    rows:
      - { id: folderInput, label: フォルダ, kind: text, placeholder: "folder ID / URL",
          save: "keys.gdrive.folderId（URL なら folders/<id> を抽出）" }
      - { id: jsonlFile,   label: ファイル, kind: file, accept: ".jsonl,.json",
          action: "notes へ取り込む（ちょっとしたものを読む）" }
      - { id: keysFile,    label: 鍵,       kind: file, accept: ".json",
          action: "keys.json を chrome.storage へマージ（box も適用）" }
  statusline:
    left: "autosave switch (default on, storage: autoSave)"
    right: "status emoji (blink 0.55s x2, idle opacity 0.28)"
  footer:
    - brand (bottom-most, 唯一のフッター要素)

sidepanel_write:                       # crx/sidepanel/write.html
  title: "chira-ura — 書く"
  body: "textarea (full height, autosave debounce 600ms)"
  footer: [コピー (primary), 過去記事 (ghost -> read.html)]
  brand: none
  gh: none

sidepanel_read:                        # crx/sidepanel/read.html
  title: "chira-ura — 過去記事"
  body: memo list (sorted by updatedAt desc)
  card:
    head: title + date
    collapsed: "preview 60 chars"
    expanded: "pre (white-space pre-wrap)"
    action: コピー (content only, no title/prefix)
  footer: [書く (ghost -> write.html)]
  brand: none
  gh: none

status:                                # 絵文字のみ。テキストは title / aria-label
  saving:   { emoji: "💾", label: 保存中 }
  saved:    { emoji: "📝", label: ローカル保存済み }
  copied:   { emoji: "📋", label: クリップボード保存済み }
  dirty:    { emoji: "✏️", label: 未保存 }
  imported: { emoji: "🗂", label: 読み込みました }
  box:      { emoji: "📦", label: 箱を変更しました }
  keyed:    { emoji: "🔑", label: 認証・鍵 }
  gas:      { emoji: "⚠️", label: 設定不足 }
  empty:    { emoji: "✖️", label: 対象がありません }
  fail:     { emoji: "🚫", label: 失敗しました }

copy:
  scope: 本文のみ                        # 前置き・タイトルを付けない＝プロンプトに流せる
  where: [sidepanel_write, sidepanel_read]   # popup にはコピーコマンドを置かない

bridge:                                # GDrive が正
  port: 8787
  endpoint: "http://127.0.0.1:8787/state"
  method: [GET, PUT]
  meaning: "CLI が GDrive ミラーを配り、拡張は pull のみ（push しない）"
  poll: "background の alarm 5分 + onInstalled/onStartup"
  applies_to_storage: [keys, box, gasUrl, bridgeRev]
  server: "chira serve"

storage_keys:                          # chrome.storage.local
  notes: "配列 [{ id, title, content, updatedAt }]"
  activeNoteId: string
  autoSave: bool
  box: "local | gdrive | gh | box（既定 gdrive）"
  keys: "keys.json をマージした非秘密設定（トークンは置かない）"
  gasUrl: string
  bridgeRev: number
  note: "旧キー（残骸）"

cli:                                   # cli/cli.js（bin: chira）
  keys_path: ~/.config/chira-ura/keys.json
  commands:
    - "chira set <key> <value>"
    - "chira get [key]"
    - "chira box <local|gdrive|gh|box>"
    - "chira client-id <id>.apps.googleusercontent.com"
    - "chira path"
    - "chira keys"
    - "chira serve [--port N]"
    - "chira pull"
    - "chira push"
    - "chira sync"                     # 意味は「GDrive が正」= pull

rules:
  - 設定画面・テーマ選択・複数箱リストを拡張内に作らない
  - 認証は OAuth。トークンを平文に置かない
  - 権限は storage / sidePanel / identity / identity.email / alarms のみ
  - popup のコマンドは動詞のみ。値は右に小さく
  - brand は popup 最下部だけ。gh はコマンド（イシュー/履歴）に統合
  - 変更は version と version_name(-dev) を細かく上げ、dev/dev.history.md に追記
