<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura / チラ裏 — PWA</title>
  <meta name="description" content="書いたら自動保存。メモとコピーだけの軽量PWAメモ帳。" />
  <meta name="theme-color" content="#faf7f0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <span class="brand-title">chira<span>ura</span></span>
        <span class="brand-sub">PWA</span>
      </div>
      <div class="header-status">
        <span class="net-status" id="netStatus" title="通信状態">
          <span class="net-dot"></span>
          <span class="net-text" id="netText">オンライン</span>
        </span>
        <button class="btn-install" id="btnInstall" type="button">アプリをインストール</button>
      </div>
    </header>

    <!-- Navigation tabs: 一覧 / 書く / 読む -->
    <nav class="view-nav" role="tablist">
      <button class="nav-tab active" id="tabWrite" role="tab" data-view="write" aria-selected="true">書く</button>
      <button class="nav-tab" id="tabList" role="tab" data-view="list" aria-selected="false">一覧</button>
      <button class="nav-tab" id="tabRead" role="tab" data-view="read" aria-selected="false">読む</button>
    </nav>

    <!-- Main View Switcher -->
    <main class="main-content">
      <!-- 1. 書く (Write / Edit) -->
      <section class="view-panel active" id="viewWrite" role="tabpanel">
        <textarea class="editor-area" id="noteEditor" placeholder="ここにメモを書く… 自動保存されます" autofocus></textarea>
      </section>

      <!-- 2. 一覧 (List) -->
      <section class="view-panel" id="viewList" role="tabpanel">
        <div class="list-toolbar">
          <span class="list-count" id="listCount">0 件のメモ</span>
          <button class="btn mini" id="btnListNew" type="button">＋ 新規メモ</button>
        </div>
        <div id="notesContainer"></div>
      </section>

      <!-- 3. 読む (Read / Preview) -->
      <section class="view-panel" id="viewRead" role="tabpanel">
        <div class="read-header">
          <h2 class="read-title" id="readTitle">無題</h2>
          <time class="read-date" id="readDate"></time>
        </div>
        <pre class="read-body" id="readBody"></pre>
      </section>
    </main>

    <!-- Statusline -->
    <div class="statusline">
      <span class="status-indicator" id="statusIndicator" role="status" aria-live="polite"></span>
    </div>

    <!-- Footer Controls -->
    <footer class="app-footer">
      <div class="footer-group">
        <button class="btn primary" id="btnNew" type="button">＋ NEW</button>
        <button class="btn" id="btnCopy" type="button">コピー</button>
      </div>
      <div class="footer-group">
        <button class="btn ghost mini" id="btnExport" type="button" title="JSONL 形式でエクスポート">エクスポート</button>
        <button class="btn ghost mini" id="btnImport" type="button" title="JSONL 形式をインポート">インポート</button>
        <input type="file" id="fileImport" class="file-input-hidden" accept=".jsonl,.txt,application/json" />
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
