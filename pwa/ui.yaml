# chira-ura-pwa UI アップデート計画
# 出典: Space「chira-ura-pwa」の箱「pwa」(box_id: 4) に置かれた要望の紙 7 枚
# 正本スナップショット: ~/workspace/your_files/chira-ura/ura.jsonl

meta:
  app: chira-ura-pwa
  doc: ui-update-plan
  version: 0.2
  date: 2026-11-13
  source_box: pwa
  status: 実装済み（2026-11-13。P1〜P4 を実装し検証完了: 既存42箱・全紙を保持、uid・JSONL 不変。P5 自動分類は Muse 側の仕分け手順として継続。DD の実操作感のみ未検証（自動監査の範囲外））

principles:
  - UI はミニマムに。操作要素を足さず、既存の操作（プルダウン等）を DD に置き換えて減らす
  - モバイルモードを基本形とする（PC 幅でも同じ構造を広げて使う）
  - データ形式は変えない: 紙・箱の uid と JSONL 形式は現行のまま。移行は自動で、既存データはそのまま開ける

requirements:
  - id: UI-01
    source: { uid: n_mwegp8jasoxdmhfb, text: "UIをミニマムして下さい モバイルモードは" }
    note: 紙の文が途中で切れている。以下は推定として扱い、open_questions に残す
    spec:
      - 画面の常設要素は「書く紙・箱（左ペイン）・ノート（右）・箱を作るアイコン」だけに絞る
      - 設定・検索などの副次機能は常設せず、必要時のみ開く形にする
      - モバイル幅を正のレイアウトとし、広い画面では左右ペインをそのまま広げる

  - id: UI-02
    source: { uid: n_mwegr9ikxsm05ll3, text: "guiでdd紙を持つ　箱に移動できるプルダウン廃止" }
    spec:
      - 紙は GUI でドラッグ＆ドロップして持てる（タッチ・ポインタ両対応）
      - 紙を箱の上に落とすと、その箱へ移動する
      - 紙を机（左ペイン外）へ落とすと箱から出す
      - 「箱に移動」プルダウンは廃止する（移動の手段は DD のみ）

  - id: UI-03
    source: { uid: n_mwegs0c6c487gfgz, text: "すべてタブは右端に極薄ていい" }
    spec:
      - 「すべて」タブは画面右端に極薄の帯として置く（幅は最小限、ラベルは縦持ちかアイコン化）
      - タップ／クリックで全紙の一覧を開く。通常時は場所を取らない

  - id: UI-04
    source: { uid: n_mwegsv61dwl09icu, text: "箱の位置もDDで入れ替え可能ゴミ箱も箱である" }
    spec:
      - 左ペインの箱は DD で並べ替えできる（順序は保存される）
      - ゴミ箱も箱のひとつとして左ペインに並ぶ。紙を落とすと捨てられ、開くと中身が見え、戻す・完全削除ができる
      - ゴミ箱は並べ替え対象に含めるが、削除はできない箱とする

  - id: UI-05
    source: { uid: n_mwegu37i7pgi8mp1, text: "箱を持ち出す　箱を取り入れる" }
    spec:
      - 箱単位で持ち出せる: その箱の紙だけを JSONL（現行 export 形式の部分集合）で書き出す
      - 箱単位で取り入れる: ファイルを読み込み、新しい箱として追加する（uid が重なる紙は取り込み側を正として upsert）
      - 読み込みのファイル形式は JSONL に限らず、あらゆる形式に対応予定とする（txt / md / csv / yaml 等。読み込み時に紙へ変換する）※2026-11-13 ユーザー指定
      - 操作は箱の最小メニューから。詳細は UI-07 の path / URL 指定と組み合わせる

  - id: UI-06
    source: { uid: n_mwegwnzy3l2rd61g, text: "箱は左ペインにある　右には１２行までのノートがある　要素はDDで位置置換可能　紙ノートのみ箱に納められる　箱を作るアイコンがある" }
    spec:
      layout:
        left_pane: 箱の一覧（UI-04 の並べ替え・ゴミ箱を含む）
        right_pane: 選択中の箱（または机）のノート一覧。表示は 12 行まで（open_questions 参照）
      - 要素（箱・紙）は DD で位置を置き換えられる（UI-02 / UI-04 と同一の仕組みで統一）
      - 箱に納められるのは紙ノートのみ。それ以外の要素（ファイル・リンク塊など）は箱の外に置く前提とする
      - 箱を作るアイコンを左ペインに常設する（名前を入れて作成、その場で並べ替え可能）

  - id: UI-07
    source: { uid: n_mwegxxfopw7y3f8h, text: "箱の分類は自動でやってくれ　読み出し読み込みはpathかｕｒｌを伝えるのみで" }
    spec:
      - 新しく書いた紙の箱分類は自動で行う。ユーザーは箱を選ばなくてよい（机に置かれた紙を、内容から既存の箱へ仕分ける。合う箱がなければ机に残す）
      - 分類の実行者は Muse 側（紙を読んで movenote で仕分ける）を第一案とする。アプリ内蔵の自動分類は持たない（open_questions 参照）
      - 読み出し（export）・読み込み（import）は、path か URL を伝えるだけで成立する運用にする。UI 側にファイル操作の作り込みはしない
      - 箱単位の持ち出し・取り入れ（UI-05）も同じ流儀で、path / URL 指定で実行できるようにする

  - id: UI-08
    source: { date: 2026-11-13, text: "全部取り入れる　そのあと非表示する箱をトグルできる設計にしようか" }
    note: Drive の wiki（51 フォルダ・1,770 ファイル）を同期で全て取り込む決定（2026-11-13）と対で出た要望。取り込みで箱が大量に増える前提で、見せない箱を畳めることが要る
    spec:
      - 箱ごとに表示／非表示をトグルできる。非表示の箱は左ペインに出ない（データ・紙は消えない。検索や「すべて」からは辿れる）
      - トグルは箱の最小メニューから1操作で切り替える。非表示の一覧と戻し方は、隠した箱が二度と出せなくならない形にする（例: 左ペイン末尾の「非表示の箱」入口）
      - 同期で作られた箱（wiki/* など取り込み系）は、初期状態を非表示にできる。普段の箱（手で作った箱）は表示が初期値
      - 状態は箱の属性として保存する（boxes.hidden）。表示状態は端末ごとでなく箱の正の属性として持つ

  - id: UI-09
    source: { date: 2026-11-13, text: "紙はデフォルトは記入モード　箱選択後は一覧モード　最後に記入モードつき" }
    note: 再実装（2026-11-13）の直後に追加された、画面のモード遷移の要望。P1 のレイアウト挙動を上書き・具体化する
    spec:
      - デフォルト（箱を選んでいない状態＝机）は記入モードとする。書く紙が主役で、すぐ書き始められる
      - 箱を選択すると一覧モードになる。その箱の紙が一覧で並ぶ
      - 一覧の最後（末尾）には記入モードが付く。一覧を見たまま、その箱へ新しい紙を書き足せる
      - つまり「書く」が常に手の届く所にある: 入口でも記入、一覧の末尾でも記入

  - id: UI-10
    source: { date: 2026-11-13, text: "ui uxシンプルにしたいです　要素を固めて下さい　コマンドは集めて下さい　書く　探す　持ち出す　取り入れる　並び替える　メモ帳は入力は１２行まで　箱は８つまで　引き出し　棚　机" }
    note: 要素の確定（これ以上 UI の部品を増やさない）。UI-01〜UI-09 の上に被せる最終形。解釈の確定（2026-11-13、Muse が固めた案）
    spec:
      places: 場所は3つだけ
      - 机: デフォルトの場所。書く紙が主役（UI-09 の記入モード）
      - 棚: 箱が並ぶ場所。並べられる箱は最大8つまで
      - 引き出し: 棚に入らない箱の収納。取り込んだ箱（wiki/* 等）は既定でここ（= 非表示、UI-08）。開けて中身を見て、棚へ出すことができる
      elements: 要素はこれだけに固定する
      - 紙（メモ帳）: 入力は12行まで（手書きの入力欄は12行で上限。取り込み由来の長文は対象外で、全文表示は残る）
      - 箱: 棚に最大8つ。ゴミ箱は引き出し側に固定し、棚の8つには数えない
      commands: コマンドは5つに集約する（他の操作はこの5つのどれかに畳む）
      - 書く: 新規の紙（机と、各箱の一覧の末尾）
      - 探す: 紙と箱の全文検索
      - 持ち出す: 全体または箱単位の書き出し（JSONL）
      - 取り入れる: ファイル / URL の取り込み（箱になる）
      - 並び替える: ドラッグ＆ドロップによる紙・箱の移動と順序変更。棚⇄引き出しの出し入れ、ゴミ箱への投入もここに畳む
      initial_state: 棚の初期配置は手元の5箱（設計相談 / handoverbod / サブちゃんストーリー / pwa / kaggle）。wiki 系の箱は全て引き出し側

  - id: UI-11
    source: { date: 2026-11-13, text: "机はワーキング　　棚はWIKI　の入れ替えをする　分離する" }
    note: UI-10 の場所の定義を変更する（UI-10 の棚/引き出しの割り当てより UI-11 が優先）。実装中の UI-10 ビルドへは send_input で差し込み済み
    spec:
      - 机 = ワーキング。手元の紙と箱（手書きの作業中メモ）の場所
      - 棚 = WIKI。取り込んだ wiki 系の箱・紙の場所（知識の置き場）
      - 机（ワーキング）と棚（WIKI）は分離した2つのゾーンで、混ざらない
      - 紙・箱は机 ⇄ 棚の間で入れ替え（移動）できる
      - 「箱は8つまで」（UI-10）は机（ワーキング）側の箱の上限として適用する。棚（WIKI）側は対象外
      - 引き出しは棚（WIKI）側の収納として扱う（UI-10 の引き出しの役割は棚側へ移る）

  - id: UI-12
    source: { date: 2026-11-13, text: "▶アクションコマンドと▢オブジェクトを区別する　メモ倉庫でありメーラーでもある　交換日記で要望と結果をゆっくりすすめる" }
    note: 表記と役割の原則。UI-10/UI-11 で固めた要素の上に、印と役割を定める
    spec:
      - 表記: アクションコマンドには ▶、オブジェクトには ▢ の印を付け、UI の全ラベルで区別する
        - "▶ の例: ▶書く / ▶探す / ▶持ち出す / ▶取り入れる / ▶並び替える（UI-10 の5コマンド）"
        - "▢ の例: ▢紙 / ▢箱 / ▢机 / ▢棚 / ▢引き出し / ▢ゴミ箱"
      - 役割: このアプリは「メモ倉庫」であると同時に「メーラー」でもある。紙は保管されるだけでなく、Muse との間で送受信される手紙でもある
      - 交換日記: 要望と結果のやり取りは「交換日記」でゆっくり進める。設計相談の箱がその場。要望の紙 → 結果の紙が交互に積まれ、履歴そのものが日記になる（急がない、非同期が前提）
      - コマンドの絵文字: アクションはすべて絵文字にする（2026-11-13 ユーザー指定、▶ は廃止）。確定: ✏書く / 🔍探す（ユーザー指定）。📤持ち出す / 📥取り入れる / 🔀並び替える / 📦箱を作る は Muse 提案を採用として適用（ユーザーの差し替え可）
      - 説明文はすべてなくす（2026-11-13 ユーザー指定）: UI に説明・案内・補足の文章を置かない。残るのは名前と数字の最小ラベルと、紙の本文だけ

  - id: UI-13
    source: { date: 2026-11-13, text: "コマンドは左下に固める　閲覧する外部資料は棚　ワーキング箱は引き出しと呼称する７個までゴミ箱含む棚は８つまでに結果的に増やせる" }
    note: 呼称と上限の確定。UI-10/UI-11 の呼称・上限と矛盾する部分は UI-13 が勝つ
    spec:
      - コマンドは左下に固める（5コマンドを左下に固定配置）
      - 棚 = 閲覧する外部資料の場所（WIKI 側、UI-11 の棚＝WIKI を具体化）。棚に並ぶ箱は8つまで（増やせる上限が8）
      - ワーキング側の箱は「引き出し」と呼称する（机の引き出し、という物理の対応）。引き出しは7個まで、ゴミ箱を含む（現状: 手元5箱＋ゴミ箱＝6）
      - 机 = ワーキングの場所そのもの。棚 = 外部資料。2ゾーンの分離（UI-11）は維持し、入れ替えも維持

  - id: UI-14
    source: { date: 2026-11-13, text: "机の中の引き出し　机の隣のゴミ箱　机の上" }
    note: 机まわりの空間配置。UI-13 の「引き出し7個までゴミ箱含む」の置き場所を具体化し、ゴミ箱は引き出しから独立させる
    spec:
      - 机の上: いま書いている紙・作業中の紙が乗る場所（記入モードの紙はここ）
      - 机の中: 引き出し（ワーキングの箱が入る）
      - 机の隣: ゴミ箱（引き出しの一種ではなく、机の隣に別置き）
      - 上限の読み（要確認）: 引き出しは7個まで、ゴミ箱は隣に別置きで数に含めない、と読み替えた（UI-13 の「含む」から変更）

  - id: UI-15
    source: { date: 2026-11-13, text: "非表示の▢箱（32）は並び替えるコマンドが管理する　８SLOTS" }
    note: 非表示箱の管理権を ▶並び替える に集約する。個別の箱メニューの表示/非表示トグル（UI-08）はこの管理に置き換わる
    spec:
      - 非表示の ▢箱（現在32個）は、▶並び替える コマンドが管理する。出す・しまう・順序はすべて並び替えるの中で行う
      - 管理は 8 SLOTS 形式: 8つのスロットに箱を配置する。スロットに入った箱が表（棚）に出て、外れた箱は非表示に戻る
      - つまり棚の「8つまで」（UI-13）は、この8スロットそのもの

  - id: UI-16
    source: { date: 2026-11-13, text: "箱はゴミ箱も机の上も同等の層に納める　位置は固定である" }
    note: 入れ物の層の統一と、位置の固定。UI-14 のゴミ箱の独立扱いを「同等の層」に改める
    spec:
      - ゴミ箱も机の上も、箱と同等の層の入れ物（コンテナ）として扱う。特別扱いしない
      - 各入れ物の位置は固定。レイアウト上の定位置から動かない
      - 並び替え（🔀）は中身・スロットへの割り当ての変更であり、位置そのものは動かさない（8 SLOTS の考え方と一致）

  - id: UI-17
    source: { date: 2026-11-13, text: "引き出しとか　隣の表現を辞める　箱があるのみ" }
    note: 家具メタファーの呼称を全廃する。UI-13/UI-14 の「引き出し」「机の隣」「机の上」の呼称は UI-17 で置き換わる（上限や同層・位置固定の構造は残る）
    spec:
      - UI の表記から「引き出し」「隣」「机の上」などの場所・家具の表現を辞める
      - あるのは ▢箱 のみ。同層に、固定位置で並ぶ
      - 上限（旧・引き出し7 / 旧・棚8スロット）や ゾーンの区別は、箱の集まりの性質としてのみ残り、場所の名前では表さない

data_model:
  keep:
    - 紙: uid / body / box / created_at / updated_at / deleted_at（現行 JSONL のまま）
    - 箱: name / tape color（現行のまま）
  add:
    - boxes.order: 箱の表示順（UI-04 の並べ替えを保存するため）
    - boxes.hidden: 箱の表示／非表示フラグ（UI-08。既定は false=表示。取り込み系の箱は true で作れる）
    - trash as box: ゴミ箱を箱の一種として表現する（deleted_at の意味は変えず、表示と操作を箱に統一）
  actions:
    keep: [addnote, createbox, deletebox, exportjsonl, getstate, importjsonl, movenote, purgetrash, renamebox, restorenote, trashnote, updatenote]
    add_candidates:
      - reorderboxes: 箱の順序を保存する（UI-04）
      - exportbox: 箱単位の JSONL 書き出し（UI-05）
      - importbox: 箱単位の JSONL 取り入れ（UI-05）
      - setboxhidden: 箱の表示／非表示を切り替える（UI-08）

phases:
  - id: P1
    name: レイアウト刷新（ミニマム化と2ペイン化）
    scope: [UI-01, UI-03, UI-06, UI-08]
    done_when:
      - 左ペインに箱、右にノート（12行まで表示）の2ペインで日常操作が完結する
      - 「すべて」タブが右端の極薄帯になっている
      - 箱を作るアイコンから新規箱が作れる
      - 箱を非表示にトグルでき、非表示の箱は左ペインに出ず、専用入口からいつでも戻せる（UI-08）
  - id: P2
    name: DD への移行
    scope: [UI-02, UI-04, UI-06]
    done_when:
      - 紙を DD で箱へ移動でき、プルダウンが消えている
      - 箱を DD で並べ替えでき、順序が再読み込み後も残る
      - モバイルのタッチ操作でも DD が破綻しない
  - id: P3
    name: ゴミ箱の箱化
    scope: [UI-04]
    done_when:
      - ゴミ箱が左ペインの箱として並び、紙の出し入れ・復元・完全削除が箱の操作でできる
      - 既存の deleted_at データと矛盾しない
  - id: P4
    name: 箱の持ち出し・取り入れ
    scope: [UI-05, UI-07]
    done_when:
      - 箱1つを JSONL で持ち出し、別の場所で箱として取り入れられる
      - path / URL を伝えるだけの読み書きが Muse 経由で動く
  - id: P5
    name: 自動分類
    scope: [UI-07]
    done_when:
      - 机に置いた紙が、内容に応じて既存の箱へ自動で仕分けられる（Muse 側の仕分け手順として）
      - 仕分けの根拠が追える（どの紙がなぜその箱か、紙かチャットで確認できる）

open_questions:
  - q: UI-01 の紙「モバイルモードは」で文が切れている。モバイルモードに何を望むか（常時モバイル表示か、切替の廃止か）
    default: モバイル幅を唯一の正レイアウトとして進める
  - q: UI-06 の「12行まで」は、ノート本文の表示行数か、一覧の件数（12枚）か
    default: 本文表示は12行まで（超過分は開いて全文）として進める
  - q: UI-07 の自動分類は Muse 側の仕分け（都度・定期）でよいか、アプリ内蔵が要るか
    default: Muse 側の仕分けで進める（アプリは分類機能を持たない）
  - q: 箱の持ち出し・取り入れの形式
    decided: 読み込みはあらゆるファイル形式に対応予定（2026-11-13 ユーザー指定）。持ち出しは現行 exportjsonl と同形式の箱スコープ版を基本とする

non_goals:
  - JSONL スナップショット運用（~/workspace/your_files/chira-ura/ura.jsonl）の変更
  - bonsai/chira-ura（拡張機能・CLI 側）の UI 変更。これは Space の PWA のみが対象
  - 紙の検索機能の拡張（今回の紙に無いため扱わない）
