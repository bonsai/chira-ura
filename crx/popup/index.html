<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura / チラ裏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- コマンド（動詞のみ・最大7） -->
    <nav class="cmds">
      <button class="cmd" id="cmdWrite"><span class="label">書く</span></button>
      <button class="cmd" id="cmdRead"><span class="label">読む</span></button>
      <button class="cmd" id="cmdCopy"><span class="label">コピー</span></button>
      <button class="cmd" id="cmdPush"><span class="label">積む</span></button>
      <button class="cmd" id="cmdPop">
        <span class="label">取る</span>
        <span class="badge" id="badgeStack">0</span>
      </button>
      <button class="cmd" id="cmdImport"><span class="label">読み込む</span></button>
      <button class="cmd" id="cmdBox">
        <span class="label">箱</span>
        <span class="hint" id="hintBox">ローカル</span>
      </button>
    </nav>

    <!-- 箱パネル -->
    <div class="panel" id="boxPanel" hidden>
      <button class="box active" data-box="local">ローカル<span class="dot"></span></button>
      <button class="box" data-box="gdrive">GDrive<span class="dot"></span></button>
      <button class="box" data-box="gh">GitHub<span class="dot"></span></button>
      <button class="box" data-box="box">Box<span class="dot"></span></button>
      <div class="panel-foot">
        <label class="link" for="keysFile">鍵を読む</label>
        <input type="file" id="keysFile" accept=".json,application/json" hidden />
        <code id="keyHint">chira set gdrive.folderId …</code>
      </div>
    </div>

    <!-- ステータス: 自動保存トグル + 絵文字のみ -->
    <div class="statusline">
      <label class="switch" title="自動保存">
        <input type="checkbox" id="toggleAuto" checked />
        <span class="knob"></span>
      </label>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <!-- 最下部: gh → brand -->
    <footer class="footer">
      <a class="gh" id="linkGh" target="_blank" rel="noopener" hidden>gh</a>
      <div class="brand">chira<span>ura</span></div>
    </footer>
  </div>

  <input type="file" id="jsonlFile" accept=".jsonl,.json" hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
