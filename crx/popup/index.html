<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura / チラ裏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- コマンド（動詞のみ） -->
    <nav class="cmds">
      <button class="cmd" id="cmdWrite"><span class="label">書く</span></button>
      <button class="cmd" id="cmdRead"><span class="label">読む</span></button>
      <button class="cmd" id="cmdBox">
        <span class="label">箱</span>
        <span class="hint" id="hintBox">GDrive</span>
      </button>
      <a class="cmd" id="cmdIssue" target="_blank" rel="noopener"><span class="label">イシュー</span></a>
      <a class="cmd" id="cmdHistory" target="_blank" rel="noopener"><span class="label">履歴</span></a>
    </nav>

    <!-- 箱パネル（保存先・フォルダ・ファイル） -->
    <div class="panel" id="boxPanel" hidden>
      <button class="box active" data-box="local">ローカル<span class="dot"></span></button>
      <button class="box" data-box="gdrive">GDrive<span class="dot"></span></button>
      <button class="box" data-box="gh">GitHub<span class="dot"></span></button>
      <button class="box" data-box="box">Box<span class="dot"></span></button>

      <div class="panel-row">
        <span class="row-label">フォルダ</span>
        <input id="folderInput" type="text" placeholder="folder ID / URL" spellcheck="false" />
      </div>
      <div class="panel-row">
        <label class="row-label" for="jsonlFile">ファイル</label>
        <input type="file" id="jsonlFile" accept=".jsonl,.json" hidden />
        <label class="link" for="jsonlFile">読み込む</label>
        <label class="link" for="keysFile">鍵</label>
        <input type="file" id="keysFile" accept=".json,application/json" hidden />
      </div>
    </div>

    <!-- ステータス: 自動保存トグル + 絵文字のみ -->
    <div class="statusline">
      <label class="switch" title="自動保存">
        <input type="checkbox" id="toggleAuto" checked />
        <span class="knob"></span>
      </label>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <!-- 最下部: brand -->
    <footer class="footer">
      <div class="brand">chira<span>ura</span></div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
