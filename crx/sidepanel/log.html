<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chira-ura — 過去記事</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 読む -->
    <main class="log-wrap">
      <div class="list" id="noteList"></div>
    </main>

    <!-- ステータス（下部・絵文字のみ） -->
    <div class="statusline">
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <!-- フッター: 操作のみ（ブランド・リンクは popup に集約） -->
    <footer class="footer">
      <a class="btn ghost" id="btnWrite" href="index.html">書く</a>
    </footer>
  </div>

  <script type="module" src="log.js"></script>
</body>
</html>
